[package]
name = "tauri-app"
version = "1.0.10"

description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-notification = "2.4.0"
tauri-plugin-single-instance = "2"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["time"] }
reqwest = { version = "0.13.5", features = ["rustls", "json", "form"] }
rfd = "0.15"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Devices_Display", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Accessibility", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_System_Registry", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem", "Win32_Security", "Win32_Globalization", "Win32_System_Diagnostics_ToolHelp", "Win32_System_ApplicationInstallationAndServicing", "Win32_System_RemoteDesktop"] }

[dev-dependencies]
tempfile = "3"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
